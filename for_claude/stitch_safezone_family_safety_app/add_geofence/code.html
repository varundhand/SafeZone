<script>
        // Simple Interaction logic
        const sheet = document.getElementById('bottom-sheet');
        let startY;
        let startHeight;

        sheet.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
            startHeight = sheet.offsetHeight;
        });

        sheet.addEventListener('touchmove', (e) => {
            const deltaY = e.touches[0].clientY - startY;
            if (deltaY > 0) { // Only allow dragging down
                sheet.style.transform = `translateY(${deltaY}px)`;
            }
        });

        sheet.addEventListener('touchend', (e) => {
            const deltaY = e.changedTouches[0].clientY - startY;
            if (deltaY > 50) {
                // Minimize (but keep visible for context as per brief)
                sheet.style.transform = `translateY(80px)`;
            } else {
                sheet.style.transform = `translateY(0)`;
            }
        });

        // Polygon drawing micro-interaction (Visual only)
        document.querySelector('main').addEventListener('click', (e) => {
            // Ripple or feedback could go here for "dropping a point"
            console.log('Point dropped at', e.clientX, e.clientY);
