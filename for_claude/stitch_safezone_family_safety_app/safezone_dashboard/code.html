<style>

<script>
        // Micro-interaction for bottom sheet drag simulation (visual only)
        let touchStart = 0;
        const sheet = document.querySelector('.bottom-sheet');
        
        sheet.addEventListener('touchstart', (e) => {
            touchStart = e.touches[0].clientY;
        });

        sheet.addEventListener('touchmove', (e) => {
            let currentTouch = e.touches[0].clientY;
            let diff = currentTouch - touchStart;
            if (diff > 0) {
                sheet.style.transform = `translateY(${diff}px)`;
            }
        });

        sheet.addEventListener('touchend', (e) => {
            sheet.style.transform = `translateY(0)`;
        });

        // Initialize Material Symbols weight
        document.querySelectorAll('.material-symbols-outlined').forEach(span => {
            if (span.getAttribute('data-weight') === 'fill') {
                span.style.fontVariationSettings = "'FILL' 1";
            }
        });
    </script>
